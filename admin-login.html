<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXOTIC ONE - Admin Login</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="static/icon.png">
    <link rel="stylesheet" href="admin-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--primary-black);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--secondary-black);
            border: 1px solid var(--border-gray);
            padding: 30px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .login-header img { height: 50px; filter: brightness(0) invert(1); }
        .login-header h1 {
            margin-top: 10px;
            font-family: var(--font-primary);
            font-size: 1.6rem;
            background: linear-gradient(45deg, var(--primary-white), var(--light-gray));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .login-form { display: flex; flex-direction: column; gap: 15px; }
        .login-form label { font-size: 12px; color: var(--light-gray); letter-spacing: 1px; text-transform: uppercase; }
        .login-form input {
            width: 100%;
            padding: 12px 15px;
            background: var(--primary-black);
            border: 2px solid var(--border-gray);
            color: var(--primary-white);
            font-family: var(--font-secondary);
            font-size: 14px;
        }
        .login-form input:focus { outline: none; border-color: var(--primary-white); }
        .login-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
        .error-text { color: var(--danger-red); font-size: 13px; min-height: 18px; }
        .hint { color: var(--light-gray); font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="static/Logo Without Bg.png" alt="EXOTIC ONE">
                <h1>Admin Login</h1>
            </div>
            <form id="loginForm" class="login-form">
                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Enter admin password" autocomplete="current-password" required>
                </div>
                <div class="login-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                    <a href="index.html" class="btn-secondary"><i class="fas fa-home"></i> Home</a>
                </div>
                <div id="error" class="error-text"></div>
                <div class="hint">Access restricted to authorized personnel.</div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = (document.getElementById('password').value || '').trim();
            const errorEl = document.getElementById('error');
            errorEl.textContent = '';
            const btn = e.target.querySelector('button[type="submit"]');
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="loading"></span> Logging in...';
            btn.disabled = true;
            try {
                const ok = await loginWithPassword(password);
                if (ok) {
                    window.location.href = 'admin.html';
                } else {
                    errorEl.textContent = 'Invalid password';
                }
            } catch (err) {
                errorEl.textContent = 'Login failed';
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
